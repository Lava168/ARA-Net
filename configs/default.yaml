# ARA-Net Experiment Configuration (Chapter 1)
# Override via command-line: --lr 0.0003 etc.

# Training
epochs: 60
batch_size: 4
lr: 0.0005
weight_decay: 0.001
dropout: 0.3
patience: 15

# Schedule
warmup_epochs: 5
label_smoothing: 0.1
freeze_encoder_epochs: 10

# Loss
anat_weight: 0.05

# Data
n_folds: 5
include_synth: true
augment: true

# Seeds (for single-seed runs; multi-seed use --seeds 42 153 264 375 486 597)
seeds: [42]
